<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Will Koon Look?</title>
    <!-- Bump the v= number whenever you change style.css so phones load the new version -->
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Back Button Navigation to Main Hub -->
        <button class="back-link" onclick="window.location.href='index.html'">← Back Map</button>

        <!-- Dynamic Header Title -->
        <h1 class="main-title">Where Will Koon Look?</h1>

        <!-- Scene Banner Graphic -->
        <div class="image-wrapper">
            <img src="cave_scene.png" alt="Koon Scene" class="hero-image">
        </div>

        <!-- 2-Column Choice Action Grid Layout -->
        <div class="grid-container binary-grid">
            <div class="choice-block">
                <button class="btn btn-purple roll-btn" onclick="rollLoot('Mountain Cave')">Between Cave Rocks</button>
                <p class="choice-subtext">Seems To Be Worth The Try</p>
            </div>
            <div class="choice-block">
                <button class="btn btn-purple roll-btn" onclick="rollLoot('Mountain Cave')">Deep Inside Cave</button>
                <p class="choice-subtext">Looks Wet And Dark, Worth The Risk?</p>
            </div>
        </div>
    </div>

    <!-- 🐾 DYNAMIC COFFEE LOOT POPUP MODAL CONTAINER -->
    <div id="lootModal" class="modal-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; background-color: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;">
        <div class="modal-content" style="width: 100%; max-width: 360px; box-sizing: border-box; max-height: 100%; overflow-y: auto;">
            <div id="dupBadge" class="duplicate-badge" style="display:none;">Owned Duplicate</div>
            <h2 id="itemName" class="item-title">Item Name</h2>
            <div id="itemRarity" class="item-rarity">Rarity</div>

            <div class="item-frame">
                <img id="itemImg" src="" alt="Loot Artwork" class="item-artwork">
            </div>

            <p id="itemDescription" class="item-desc">Item Description</p>

            <!-- 📊 Live Set Metrics Progression Display Grid -->
            <div class="progress-section" style="margin-bottom: 20px; text-align: left; background: #222; padding: 12px; border-radius: 8px; font-size: 13px;">
                <div style="margin-bottom: 6px; display: flex; justify-content: space-between;">
                    <span>Set Completion (<span id="setNameDisplay">Set</span>):</span>
                    <span id="setPct" style="font-weight: bold; color: #E2CD5A;">0%</span>
                </div>
                <div style="margin-bottom: 12px; display: flex; justify-content: space-between; font-size: 11px; color: #aaa;">
                    <span>Items Collected: <span id="setRatio">0/5</span></span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Total Backpack Mastery:</span>
                    <span id="totalPct" style="font-weight: bold; color: #12B44C;">0%</span>
                </div>
            </div>

            <button class="btn btn-green" onclick="closeModal()">Put In Backpack</button>
        </div>
    </div>

    <!-- 🌐 ASYNCHRONOUS ENGINE SCRIPTS -->
    <script>
        // Works inside Telegram; falls back safely when opened in a normal browser for testing
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // 📍 PASTE YOUR SECURE NGROK FORWARDING LINK HERE (same as index.html, no slash at the end):
        const BACKEND_API = "https://nugget-impromptu-carefully.ngrok-free.dev";

        let rolling = false;

        function setButtonsDisabled(disabled) {
            document.querySelectorAll(".roll-btn").forEach(btn => {
                btn.disabled = disabled;
                btn.style.opacity = disabled ? "0.6" : "1";
            });
        }

        function rollLoot(zoneName) {
            if (rolling) return; // Stop double-taps from sending two rolls
            rolling = true;
            setButtonsDisabled(true);

            const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 9999, first_name: "LocalPlayer" };

            // Asynchronously fetch item data from your local PC engine endpoint
            fetch(`${BACKEND_API}/api/roll`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    // Skips ngrok's free-plan warning page, which would otherwise break the JSON response
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({
                    user_id: user.id,
                    username: user.first_name || user.username || "Explorer",
                    location: zoneName
                })
            })
            .then(res => {
                if (res.status === 403) {
                    throw new Error("cooldown");
                }
                if (!res.ok) {
                    throw new Error("server");
                }
                return res.json();
            })
            .then(data => {
                // Map out server-rolled card details onto the page layout safely
                document.getElementById("itemName").innerText = data.name;
                document.getElementById("itemRarity").innerText = data.rarity;
                document.getElementById("itemRarity").className = `item-rarity ${data.rarity}`;
                document.getElementById("itemImg").src = data.artwork_image_path;
                document.getElementById("itemDescription").innerText = data.short_description;

                // Track duplicate banner visibility
                document.getElementById("dupBadge").style.display = data.is_duplicate ? "inline-block" : "none";

                // 📊 Update live percentage metrics
                document.getElementById("setNameDisplay").innerText = data.set_name;
                document.getElementById("setPct").innerText = `${data.set_completion_pct}%`;
                document.getElementById("setRatio").innerText = `${data.set_owned_count} / ${data.set_total_count}`;
                document.getElementById("totalPct").innerText = `${data.total_backpack_pct}%`;

                // Show the modal screen overlay block
                document.getElementById("lootModal").style.display = "flex";
            })
            .catch(err => {
                if (err.message === "cooldown") {
                    alert("Koon is resting! Your 24-hour daily roll has already been used. Check the map for the countdown.");
                    window.location.href = "index.html";
                } else {
                    alert("Cannot roll loot! Make sure koon_bot.py is running and your ngrok tunnel is online.");
                    rolling = false;
                    setButtonsDisabled(false);
                }
            });
        }

        function closeModal() {
            document.getElementById("lootModal").style.display = "none";
            // Return back to map menu home to update the daily countdown clock trigger instantly
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
