<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Will Koon Look?</title>
    <!-- Keeps cache-busting link matching -->
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://telegram.org"></script>
</head>
<body>
    <div class="app-container">
        <!-- Back Link Navigation -->
        <button class="back-link" onclick="window.location.href='index.html'">← Back Map</button>

        <!-- Header Title -->
        <h1 class="main-title">Where Will Koon Look?</h1>

        <!-- Cave Scene Card Banner -->
        <div class="image-wrapper">
            <!-- Replace with your actual cave image filename -->
            <img src="cave_scene.png" alt="Koon at the Mountain Cave" class="hero-image">
        </div>

        <!-- 2-Column Choice Action Grid -->
        <div class="grid-container binary-grid">
            <!-- Choice 1 -->
            <div class="choice-block">
                <button class="btn btn-purple" onclick="onAction('Between Cave Rocks')">Between Cave Rocks</button>
                <p class="choice-subtext">Seems To Be Worth The Try</p>
            </div>

            <!-- Choice 2 -->
            <div class="choice-block">
                <button class="btn btn-purple" onclick="onAction('Deep Inside Cave')">Deep Inside Cave</button>
                <p class="choice-subtext">Looks Wet And Dark, Worth The Risk?</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onAction(choiceName) {
            // Sends the choice directly back to your local PC python bot script
            tg.sendData(JSON.stringify({ action: choiceName }));
        }
    </script>
</body>
</html>
