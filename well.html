<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Will Koon Look?</title>
    <!-- Use your cache-busting link parameter -->
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://telegram.org"></script>
</head>
<body>
    <div class="app-container">
        <!-- Back Link Navigation -->
        <button class="back-link" onclick="window.location.href='index.html'">← Back Map</button>

        <!-- Main Header Title -->
        <h1 class="main-title">Where Will Koon Look?</h1>

        <!-- Well Scene Card Banner -->
        <div class="image-wrapper">
            <!-- Replace with your actual well image filename -->
            <img src="well_scene.png" alt="Koon at the Abandoned Well" class="hero-image">
        </div>

        <!-- 2-Column Choice Action Grid -->
        <div class="grid-container binary-grid">
            <!-- Choice 1 -->
            <div class="choice-block">
                <button class="btn btn-purple" onclick="onAction('In The Well')">In The Well</button>
                <p class="choice-subtext">Looks Wet, But Feels Lucky.</p>
            </div>

            <!-- Choice 2 -->
            <div class="choice-block">
                <button class="btn btn-purple" onclick="onAction('In The Bucket')">In The Bucket</button>
                <p class="choice-subtext">Seems Like A Good Place To Start</p>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onAction(choiceName) {
            // Sends the button data directly back to your running python script on your PC
            tg.sendData(JSON.stringify({ action: choiceName }));
        }
    </script>
</body>
</html>
