<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koon's Backpack Inventory</title>
    <!-- Configured to match your cache-busting v=3 stylesheet -->
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://telegram.org"></script>
</head>
<body class="backpack-body">
    <div class="app-container backpack-layout">
        
        <!-- Navigation Hub Bars -->
        <div class="backpack-header">
            <button class="back-link" onclick="window.location.href='index.html'">← Back Map</button>
            <div class="mastery-badge">Mastery: <span id="masteryPct">0%</span></div>
        </div>

        <!-- Scrollable Shelving Layout Frame -->
        <div id="shelfContainer" class="shelf-scroll-area">
            <div class="loading-text">Opening Backpack...</div>
        </div>
    </div>

    <!-- 🔍 INTERACTIVE ITEM DETAILS MODAL DRAWER LAYER -->
    <div id="itemDetailsModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="inspectName" class="item-title">Item Name</h2>
            <div id="inspectRarity" class="item-rarity">RARITY</div>
            
            <div class="item-frame">
                <img id="inspectImg" src="" alt="Item Card Thumbnail" class="item-artwork">
            </div>
            
            <p id="inspectDescription" class="item-desc">Item Description</p>
            
            <button class="btn btn-green" onclick="closeInspectModal()">Close Details</button>
        </div>
    </div>

    <!-- 🌐 ASYNCHRONOUS PACK PARSER ENGINE -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 📍 PASTE YOUR EXACT SAME LIVE NGROK FORWARDING LINK HERE:
        const BACKEND_API = "https://nugget-impromptu-carefully.ngrok-free.dev";

        document.addEventListener("DOMContentLoaded", () => {
            const user = tg.initDataUnsafe.user || { id: 9999 };

            // Request full inventory index tracking arrays from your local PC database
            fetch(`${BACKEND_API}/api/backpack`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: user.id })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("masteryPct").innerText = `${data.overall_progress_pct}%`;
                const container = document.getElementById("shelfContainer");
                container.innerHTML = ""; // Clear active loading string text

                // Map your nested coffee collection arrays into the visual layout shelf
                data.sets.forEach(set => {
                    const setWrapper = document.createElement("div");
                    setWrapper.className = "set-group-card";

                    setWrapper.innerHTML = `
                        <div class="set-meta-header">
                            <span class="set-title-label">${set.set_name}</span>
                            <span class="set-ratio-counter ${set.rarity}">${set.owned_count}/${set.total_count}</span>
                        </div>
                        <div class="item-grid-row">
                            ${set.items.map(item => {
                                // Escape single quotes safely to protect descriptive string mapping parameters
                                const cleanDesc = item.short_description.replace(/'/g, "\\'");
                                const cleanName = item.name.replace(/'/g, "\\'");
                                
                                return `
                                    <div class="inventory-slot \${item.owned ? 'slot-unlocked' : 'slot-locked'}" 
                                         onclick="inspectItem('cleanName', '{cleanDesc}', '\({item.artwork_image_path}', '\){set.rarity}')">
                                        <img src="\({item.artwork_image_path}" alt="\){item.name}" class="slot-thumbnail">
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    container.appendChild(setWrapper);
                });
            })
            .catch(err => {
                document.getElementById("shelfContainer").innerHTML = 
                    `<div class="error-text">PC Server Offline! Run bot.py and check your active Ngrok pipeline links.</div>`;
            });
        });

        // Interactive asset inspector function
        function inspectItem(name, desc, imgPath, rarity) {
            document.getElementById("inspectName").innerText = name;
            document.getElementById("inspectRarity").innerText = rarity;
            document.getElementById("inspectRarity").className = `item-rarity ${rarity}`;
            document.getElementById("inspectImg").src = imgPath;
            document.getElementById("inspectDescription").innerText = desc;
            
            // Pop open details layout grid card overlay modal block smooth framework
            document.getElementById("itemDetailsModal").style.display = "flex";
        }

        function closeInspectModal() {
            document.getElementById("itemDetailsModal").style.display = "none";
        }
    </script>
</body>
</html>
